# Host local de exemplo, sem domínio público ou certificado.
server {
    listen 8080;
    server_name tesouraria.localhost;

    client_max_body_size 64k;
    access_log /dev/stdout tesouraria_pix_safe;
    # Erros nativos podem incluir a request line completa e tokens na URL.
    error_log /dev/null;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn tesouraria_pix_connections 10;

    # Todas as diretivas no mesmo nível: específicas nunca ocultam a geral.
    # Geral: até 5 excedentes imediatos; sensíveis: 1. Sem fila (nodelay).
    limit_req zone=tesouraria_pix_general burst=5 nodelay;
    limit_req zone=tesouraria_pix_login burst=1 nodelay;
    limit_req zone=tesouraria_pix_cadastro burst=1 nodelay;
    limit_req zone=tesouraria_pix_forgot_password burst=1 nodelay;
    limit_req zone=tesouraria_pix_resend_verification burst=1 nodelay;
    limit_req zone=tesouraria_pix_reset_password burst=1 nodelay;
    limit_req zone=tesouraria_pix_verify_email burst=1 nodelay;

    location / {
        # Variável evita resolução obrigatória na inicialização e no nginx -t.
        set $tesouraria_backend tesouraria-api:8080;
        proxy_pass http://$tesouraria_backend;
    }
}

# Carregado pelo include de nginx.conf no contexto http.
# $uri é normalizado, sem query string; aceitar também barra final.
map $uri $tesouraria_pix_login_key {
    default "";
    ~^/api/v1/auth/login/?$ $binary_remote_addr;
}
limit_req_zone $tesouraria_pix_login_key zone=tesouraria_pix_login:1m rate=5r/m;

map $uri $tesouraria_pix_cadastro_key {
    default "";
    ~^/api/v1/users/?$ $binary_remote_addr;
}
limit_req_zone $tesouraria_pix_cadastro_key zone=tesouraria_pix_cadastro:1m rate=5r/m;

map $uri $tesouraria_pix_forgot_password_key {
    default "";
    ~^/api/v1/auth/forgot-password/?$ $binary_remote_addr;
}
limit_req_zone $tesouraria_pix_forgot_password_key zone=tesouraria_pix_forgot_password:1m rate=3r/m;

map $uri $tesouraria_pix_resend_verification_key {
    default "";
    ~^/api/v1/auth/resend-verification/?$ $binary_remote_addr;
}
limit_req_zone $tesouraria_pix_resend_verification_key zone=tesouraria_pix_resend_verification:1m rate=3r/m;

map $uri $tesouraria_pix_reset_password_key {
    default "";
    ~^/api/v1/auth/reset-password/?$ $binary_remote_addr;
}
limit_req_zone $tesouraria_pix_reset_password_key zone=tesouraria_pix_reset_password:1m rate=5r/m;

map $uri $tesouraria_pix_verify_email_key {
    default "";
    ~^/api/v1/auth/verify-email/?$ $binary_remote_addr;
}
limit_req_zone $tesouraria_pix_verify_email_key zone=tesouraria_pix_verify_email:1m rate=5r/m;

limit_req_zone $binary_remote_addr zone=tesouraria_pix_general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tesouraria_pix_connections:1m;

# Sem URL, headers ou corpo: até caminhos podem conter tokens.
log_format tesouraria_pix_safe '$remote_addr [$time_local] "$request_method" '
    '$status $body_bytes_sent request_time=$request_time '
    'upstream_status=$upstream_status limit_req=$limit_req_status limit_conn=$limit_conn_status';

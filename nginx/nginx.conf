# Master e workers executam como UID/GID 101 definidos no Compose.
# Sem diretiva user: o master já inicia sem privilégios.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Não registrar query strings, que podem conter dados sensíveis.
    log_format gateway '$remote_addr - $host [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout gateway;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # DNS interno Docker; a resolução do backend ocorre nas requisições.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Gateway de borda: substitui cabeçalhos enviados pelo cliente.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # HTTPS fica fora deste include e não é carregado nesta etapa.
    include /etc/nginx/conf.d/*.conf;
}

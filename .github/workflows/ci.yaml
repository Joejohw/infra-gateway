name: Gateway security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway-security:
    name: gateway-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate Compose, Nginx and HTTP protection
        run: bash tests/ci.sh
      - name: Check whitespace
        run: git diff --check
